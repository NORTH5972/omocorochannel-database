<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理者編集 | オモコロチャンネル動画データベース</title>
<style>
:root{color-scheme:light;--ink:#222;--muted:#666;--line:#ddd;--wash:#f5f4f1;--accent:#b33c27}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6}header{background:#fff;border-bottom:1px solid var(--line);padding:28px 20px}header .inner,main,footer{max-width:1050px;margin:auto}h1{font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.25;margin:0 0 8px}header p{margin:0;color:var(--muted)}main{padding:22px 16px 48px}.notice,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}.notice{font-size:.9rem;background:#fff8e8;border-color:#e8d9b5}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button,.reset,button,.button{border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}.tabs button[aria-selected=true],button.primary,.button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}button:disabled{opacity:.4;cursor:not-allowed}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}.filters label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:4px}.filters input,.filters select,.date-input{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font:inherit;background:white}.filter-wide{grid-column:span 2}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;color:var(--muted);font-size:.9rem}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{padding:10px 12px;background:#f0efec;border-radius:8px;white-space:pre-wrap;margin:12px 0}.status.error{background:#fff0ee;color:#8e2d1e}.list{display:grid;gap:12px}.video{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px}.thumb{width:100%;aspect-ratio:16/9;background:#eee;border-radius:7px;display:grid;place-items:center;color:#777;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.video h2{font-size:1.05rem;line-height:1.45;margin:0 0 6px}.video h2 a{color:inherit;text-decoration:none}.video h2 a:hover{text-decoration:underline}.meta{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}.edit-grid{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:10px;align-items:start;margin-top:12px}.edit-label{font-size:.82rem;color:var(--muted);padding-top:8px}.performer-picker{position:relative}.picker-button{width:100%;text-align:left;min-height:40px}.picker-menu{display:none;position:absolute;z-index:5;top:calc(100% + 4px);left:0;width:min(340px,90vw);max-height:260px;overflow:auto;background:#fff;border:1px solid #ccc;border-radius:9px;padding:8px;box-shadow:0 8px 24px #0002}.performer-picker.open .picker-menu{display:block}.picker-menu label{display:flex;align-items:center;gap:8px;padding:6px 5px;font-size:.9rem;cursor:pointer}.picker-menu input{width:auto}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:.8rem;padding:3px 9px;background:#f1f0ed;border-radius:999px}.chip.performer{border:1px solid #d7d3cc;background:#fff}.empty{padding:32px 16px;text-align:center;background:#fff;border:1px dashed #ccc;border-radius:12px;color:var(--muted)}.pagebar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:18px}.pagebar button{padding:8px 12px}.page-info{width:100%;text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:4px}.hidden{display:none!important}footer{padding:20px 16px 35px;font-size:.82rem;color:var(--muted)}
@media(max-width:700px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.video{grid-template-columns:1fr}.thumb{max-width:420px}.filter-wide{grid-column:span 2}.edit-grid{grid-template-columns:1fr;gap:4px}.edit-label{padding-top:4px}}
</style>
</head>
<body>
<header><div class="inner"><h1>オモコロチャンネル<br>動画データベース</h1><p>管理者用編集画面｜公開ページと同じ一覧・絞り込みで動画を管理</p></div></header>
<main>
<div class="notice">編集内容は「変更を保存」を押すとGitHubに反映されます。公開日が未登録の場合は空欄のまま保存できます。</div>
<section id="loginPanel" class="panel hidden"><h2>管理者ログイン</h2><p>指定されたGitHubアカウントでログインしてください。</p><a class="button primary" href="/login">GitHubでログイン</a></section>
<section id="appPanel" class="hidden">
<div class="panel">
 <div class="toolbar"><span id="loginInfo">ログイン状態を確認しています...</span><div class="actions"><button id="reload">再読み込み</button><button id="logout">ログアウト</button></div></div>
 <div id="status" class="status">動画データを読み込んでいます...</div>
 <div class="actions"><button id="save" class="primary" disabled>変更を保存</button><strong id="dirty">未保存の変更：0件</strong></div>
</div>
<nav class="tabs"><button id="videosTab" aria-selected="true">動画一覧</button></nav>
<section id="videoSection">
<div class="filters">
 <div class="filter-wide"><label for="q">キーワード（タイトル・説明・動画ID）</label><input id="q" type="search" placeholder="動画タイトルやキーワード"></div>
 <div><label for="person">出演者</label><select id="person"><option value="">すべて</option></select></div>
 <div><label for="protagonist">主役</label><select id="protagonist"><option value="">すべて</option></select></div>
 <div><label for="genre">ジャンル</label><select id="genre"><option value="">すべて</option></select></div>
 <div><label for="ending">エンディング</label><select id="ending"><option value="">すべて</option></select></div>
 <div><label for="year">公開年</label><select id="year"><option value="">すべて</option></select></div>
 <div><label for="month">公開月</label><select id="month"><option value="">すべて</option></select></div>
 <div><label for="sort">並び順</label><select id="sort"><option value="new">公開日が新しい順</option><option value="old">公開日が古い順</option><option value="title">タイトル順</option></select></div>
</div>
<div class="toolbar"><span id="resultCount"></span><button class="reset" id="reset">条件をリセット</button></div>
<div id="videoList" class="list"></div><nav id="pagination" class="pagebar" aria-label="動画一覧のページ切り替え"></nav>
</section>
</section>
</main>
<footer>オモコロチャンネル動画データベース 管理者専用</footer>
<script>
const $=id=>document.getElementById(id);let videos=[],original=new Map(),endings=[],page=1;const PAGE_SIZE=30;let performerOptions=[];
const arr=v=>Array.isArray(v)?v:[], unique=xs=>[...new Set(xs.flatMap(x=>arr(x)))].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),"ja"));
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function linkFor(v){return v.youtubeUrl||v.url||(v.videoId?"https://www.youtube.com/watch?v="+encodeURIComponent(v.videoId):"")}
function status(message,error){$("status").textContent=message;$("status").classList.toggle("error",!!error)}
async function api(path,options){const res=await fetch(path,Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},options||{}));let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||("HTTP "+res.status));return data}
async function boot(){try{const me=await api("/api/me");$("appPanel").classList.remove("hidden");$("loginPanel").classList.add("hidden");$("loginInfo").textContent="ログイン中："+me.login;await load()}catch(e){$("loginPanel").classList.remove("hidden");$("appPanel").classList.add("hidden");if(e.message!=="ログインしてください。")console.error(e)}}
async function load(){status("GitHubから動画データを読み込んでいます...");$("save").disabled=true;try{const data=await api("/api/videos");videos=arr(data.videos);original=new Map(videos.map(v=>[v.id,{publishedAt:v.publishedAt||"",performers:arr(v.performers).join("\u0000")} ]));page=1;performerOptions=unique(videos.map(v=>v.performers));fillFilters();render();status("動画データを読み込みました。編集後は「変更を保存」を押してください。")}catch(e){status(e.message,true)}}
function fillSelect(id,values){const el=$(id),old=el.value;el.innerHTML='<option value="">すべて</option>'+values.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");if(values.includes(old))el.value=old}
function fillFilters(){fillSelect("person",performerOptions);fillSelect("protagonist",unique(videos.map(v=>v.protagonists||v.mainCharacters||(v.protagonist?[v.protagonist]:[]))));fillSelect("genre",unique(videos.map(v=>v.genres||v.genre)));const endVals=unique(videos.map(v=>{const e=v.endingScreen||v.endingScreenId||v.ending||"";return endings.find(x=>x.id===e)?.name||e}));fillSelect("ending",endVals);fillSelect("year",[...new Set(videos.map(v=>(v.publishedAt||"").slice(0,4)).filter(x=>/^\d{4}$/.test(x)))].sort((a,b)=>b.localeCompare(a)));fillSelect("month",Array.from({length:12},(_,i)=>String(i+1).padStart(2,"0")))}
function filtered(){const q=$("q").value.trim().toLowerCase(),person=$("person").value,main=$("protagonist").value,genre=$("genre").value,ending=$("ending").value,year=$("year").value,month=$("month").value;return videos.filter(v=>{const people=arr(v.performers),mains=arr(v.protagonists||v.mainCharacters||(v.protagonist?[v.protagonist]:[])),genres=arr(v.genres||(v.genre?[v.genre]:[])),end=v.endingScreen||v.endingScreenId||v.ending||"",date=String(v.publishedAt||""),endName=endings.find(e=>e.id===end)?.name||end;return(!q||[v.title,v.description,v.id].join(" ").toLowerCase().includes(q))&&(!person||people.includes(person))&&(!main||mains.includes(main))&&(!genre||genres.includes(genre))&&(!ending||end===ending||endName===ending)&&(!year||date.startsWith(year))&&(!month||date.slice(5,7)===month)})}
function dirtyCount(){let n=0;for(const v of videos){const o=original.get(v.id);if(o&&((v.publishedAt||"")!==o.publishedAt||arr(v.performers).join("\u0000")!==o.performers))n++}return n}
function updateDirty(){$("dirty").textContent="未保存の変更："+dirtyCount()+"件";$("save").disabled=dirtyCount()===0}
function render(){let list=filtered();list.sort((a,b)=>$("sort").value==="title"?String(a.title).localeCompare(String(b.title),"ja"):$("sort").value==="old"?String(a.publishedAt||"").localeCompare(String(b.publishedAt||"")):String(b.publishedAt||"").localeCompare(String(a.publishedAt||"")));const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));page=Math.min(page,totalPages);const start=(page-1)*PAGE_SIZE,items=list.slice(start,start+PAGE_SIZE);$("resultCount").textContent=list.length+"件中 "+(list.length?start+1:0)+"–"+Math.min(start+PAGE_SIZE,list.length)+"件を表示（全 "+videos.length+"件）";$("videoList").innerHTML=items.length?items.map(v=>{const people=arr(v.performers),thumb=v.thumbnailUrl||v.thumbnail||"",href=linkFor(v),mains=arr(v.protagonists||v.mainCharacters||(v.protagonist?[v.protagonist]:[])),genres=arr(v.genres||(v.genre?[v.genre]:[])),end=v.endingScreen||v.endingScreenId||v.ending||"";return '<article class="video" data-id="'+esc(v.id)+'"><div class="thumb">'+(thumb?'<img loading="lazy" src="'+esc(thumb)+'" alt="">':"サムネイル未登録")+'</div><div><h2>'+(href?'<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(v.title||"タイトル未登録")+"</a>":esc(v.title||"タイトル未登録"))+'</h2><div class="meta">公開日：'+(v.publishedAt?esc(v.publishedAt):"未登録")+" ｜ ID："+esc(v.id)+'</div><div class="chips">'+mains.map(x=>'<span class="chip">'+esc(x)+"（主役）</span>").join("")+genres.map(x=>'<span class="chip">'+esc(x)+"</span>").join("")+(end?'<span class="chip">エンディング：'+esc(endings.find(e=>e.id===end)?.name||end)+"</span>":"")+'</div><div class="edit-grid"><div class="edit-label">公開日</div><div><input class="date-input" data-field="date" type="date" value="'+esc(v.publishedAt||"")+'"></div><div class="edit-label">出演者（複数選択可）</div><div><div class="performer-picker"><button type="button" class="picker-button">出演者を選択（'+people.length+"人） ▾</button><div class="picker-menu">"+performerOptions.map(p=>'<label><input type="checkbox" data-performer="'+esc(p)+'" '+(people.includes(p)?"checked":"")+'> '+esc(p)+"</label>").join("")+'</div></div><div class="chips performer-chips">'+people.map(p=>'<span class="chip performer">'+esc(p)+"</span>").join("")+'</div></div></div></div></article>'}).join(""):'<div class="empty">該当する動画はありません。</div>';renderPagination(totalPages,list.length);updateDirty()}
function renderPagination(total,totalItems){const nav=$("pagination");if(!totalItems){nav.innerHTML="";return}let html='<div class="page-info">ページ '+page+" / "+total+'</div><button data-page="'+(page-1)+'" '+(page===1?"disabled":"")+">前へ</button>";const pages=[...new Set([1,total,page-2,page-1,page,page+1,page+2].filter(p=>p>=1&&p<=total))].sort((a,b)=>a-b);let last=0;for(const p of pages){if(last&&p>last+1)html+="<span>…</span>";html+='<button data-page="'+p+'" '+(p===page?'class="primary"':"")+">"+p+"</button>";last=p}html+='<button data-page="'+(page+1)+'" '+(page===total?"disabled":"")+">次へ</button>";nav.innerHTML=html}
$("videoList").addEventListener("click",e=>{const btn=e.target.closest(".picker-button");if(btn){const picker=btn.closest(".performer-picker");document.querySelectorAll(".performer-picker.open").forEach(x=>{if(x!==picker)x.classList.remove("open")});picker.classList.toggle("open")}});
document.addEventListener("click",e=>{if(!e.target.closest(".performer-picker"))document.querySelectorAll(".performer-picker.open").forEach(x=>x.classList.remove("open"))});
$("videoList").addEventListener("change",e=>{const row=e.target.closest(".video");if(!row)return;const v=videos.find(x=>x.id===row.dataset.id);if(!v)return;if(e.target.dataset.field==="date"){v.publishedAt=e.target.value}else if(e.target.dataset.performer){const name=e.target.dataset.performer;let p=arr(v.performers).slice();p=e.target.checked?(p.includes(name)?p:[...p,name]):p.filter(x=>x!==name);v.performers=p;const chips=row.querySelector(".performer-chips");chips.innerHTML=p.map(x=>'<span class="chip performer">'+esc(x)+"</span>").join("");row.querySelector(".picker-button").textContent="出演者を選択（"+p.length+"人） ▾"}updateDirty()});
$("pagination").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(!b||b.disabled)return;page=Number(b.dataset.page);render();$("videoList").scrollIntoView({behavior:"smooth",block:"start"})});
["q","person","protagonist","genre","ending","year","month","sort"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",()=>{page=1;render()}));
$("reset").addEventListener("click",()=>{["q","person","protagonist","genre","ending","year","month"].forEach(id=>$(id).value="");$("sort").value="new";page=1;render()});
$("reload").addEventListener("click",()=>{if(dirtyCount()&&!confirm("未保存の変更があります。破棄して再読み込みしますか？"))return;load()});
$("logout").addEventListener("click",async()=>{try{await api("/logout",{method:"POST",body:"{}"})}finally{location.reload()}});
$("save").addEventListener("click",async()=>{const updates=videos.filter(v=>{const o=original.get(v.id);return o&&((v.publishedAt||"")!==o.publishedAt||arr(v.performers).join("\u0000")!==o.performers)}).map(v=>({id:v.id,publishedAt:v.publishedAt||"",performers:arr(v.performers)}));if(!updates.length)return;if(!confirm(updates.length+"件の変更をGitHubに保存します。続けますか？"))return;$("save").disabled=true;status("GitHubに保存しています...");try{const result=await api("/api/save",{method:"POST",body:JSON.stringify({updates})});await load();status(result.updated+"件を保存しました。GitHub Pagesへの反映には少し時間がかかります。"+(result.commit?"\n変更履歴："+result.commit:""))}catch(e){status(e.message,true);updateDirty()}});
boot();
</script>
</body></html>
