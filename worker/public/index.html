<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理者編集 | オモコロチャンネル動画データベース</title>
<style>
:root{color-scheme:light;--ink:#222;--muted:#666;--line:#ddd;--paper:#fff;--wash:#f5f4f1;--accent:#b33c27}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.55}header{background:white;border-bottom:1px solid var(--line);padding:22px 16px}header div,main{max-width:1100px;margin:auto}h1{font-size:1.5rem;margin:0}header p{margin:5px 0 0;color:var(--muted)}main{padding:22px 14px 50px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:180px}.field label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:5px}input{width:100%;padding:10px;border:1px solid #bbb;border-radius:7px;font:inherit}button,.button{border:1px solid #bbb;border-radius:7px;padding:9px 13px;background:white;color:var(--ink);font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button:disabled{opacity:.4;cursor:not-allowed}.muted{color:var(--muted);font-size:.9rem}.status{margin:12px 0;padding:10px 12px;background:#f0efec;border-radius:8px;white-space:pre-wrap}.error{background:#fff0ee;color:#8e2d1e}.tablewrap{overflow-x:auto}.video{display:grid;grid-template-columns:minmax(220px,2fr) minmax(145px,1fr) minmax(230px,2fr);gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid #eee}.video:last-child{border-bottom:0}.title{font-weight:650;overflow-wrap:anywhere}.id{font-size:.78rem;color:var(--muted)}.pagebar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:15px}.pagebar span{padding:6px;color:var(--muted)}.count{color:var(--muted);font-size:.9rem;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}@media(max-width:720px){.video{grid-template-columns:1fr}.field{min-width:100%}}
</style>
</head>
<body>
<header><div><h1>動画データ管理</h1><p>管理者専用・変更はGitHubに保存されます</p></div></header>
<main>
<section id="loginPanel" class="panel hidden"><h2>管理者ログイン</h2><p>指定されたGitHubアカウントでログインしてください。</p><a class="button primary" href="/login">GitHubでログイン</a></section>
<section id="appPanel" class="hidden">
<div class="panel"><div class="row"><div class="field"><label for="q">動画タイトル・IDで検索</label><input id="q" type="search" placeholder="キーワードを入力"></div><div class="actions"><button id="reload">再読み込み</button><button id="logout">ログアウト</button></div></div><p class="muted">公開日はYYYY-MM-DD形式です。出演者はカンマ区切りで入力します。空欄の公開日は未登録として保存されます。</p><div id="status" class="status">ログイン状態を確認しています...</div><div class="actions"><button id="save" class="primary" disabled>変更を保存</button><span id="dirty" class="muted">未保存の変更：0件</span></div></div>
<div class="panel"><div id="count" class="count"></div><div id="rows" class="tablewrap"></div><div id="pages" class="pagebar"></div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let videos=[],original=new Map(),page=1;const SIZE=30;let loggedIn=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(message,error){$('status').textContent=message;$('status').classList.toggle('error',!!error)}
async function api(path,options){const res=await fetch(path,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},options||{}));let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||('HTTP '+res.status));return data}
async function boot(){try{const me=await api('/api/me');loggedIn=true;$('appPanel').classList.remove('hidden');$('loginPanel').classList.add('hidden');status('ログイン中：'+me.login);await load()}catch(e){$('loginPanel').classList.remove('hidden');$('appPanel').classList.add('hidden');if(e.message!=='ログインしてください。')status(e.message,true)}}
async function load(){status('GitHubから動画データを読み込んでいます...');$('save').disabled=true;try{const data=await api('/api/videos');videos=data.videos;original=new Map(videos.map(v=>[v.id,{publishedAt:v.publishedAt||'',performers:(v.performers||[]).join(', ')}]));page=1;render();status('データを読み込みました。変更後は「変更を保存」を押してください。')}catch(e){status(e.message,true)}}
function filtered(){const q=$('q').value.trim().toLowerCase();return videos.filter(v=>!q||String(v.title||'').toLowerCase().includes(q)||String(v.id||'').toLowerCase().includes(q))}
function dirtyCount(){let n=0;for(const v of videos){const o=original.get(v.id);if(!o)continue;if((v.publishedAt||'')!==o.publishedAt||(v.performers||[]).join(', ')!==o.performers)n++}return n}
function render(){const list=filtered(),pages=Math.max(1,Math.ceil(list.length/SIZE));page=Math.min(page,pages);$('count').textContent=list.length+'件中 '+(list.length?(page-1)*SIZE+1:0)+'〜'+Math.min(page*SIZE,list.length)+'件を表示 / 全'+videos.length+'件';$('rows').innerHTML=list.slice((page-1)*SIZE,page*SIZE).map(v=>'<div class="video" data-id="'+esc(v.id)+'"><div><div class="title">'+esc(v.title)+'</div><div class="id">'+esc(v.id)+'</div></div><div><label class="muted" for="date-'+esc(v.id)+'">公開日</label><input id="date-'+esc(v.id)+'" data-field="date" type="date" value="'+esc(v.publishedAt||'')+'"></div><div><label class="muted" for="people-'+esc(v.id)+'">出演者（カンマ区切り）</label><input id="people-'+esc(v.id)+'" data-field="performers" value="'+esc((v.performers||[]).join(', '))+'" placeholder="ARuFa, かんち"></div></div>').join('')||'<p class="muted">該当する動画はありません。</p>';let html='<button data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>前へ</button>';for(let p=Math.max(1,page-2);p<=Math.min(pages,page+2);p++)html+='<button data-page="'+p+'" '+(p===page?'class="primary"':'')+'>'+p+'</button>';html+='<button data-page="'+(page+1)+'" '+(page===pages?'disabled':'')+'>次へ</button><span>ページ '+page+' / '+pages+'</span>';$('pages').innerHTML=html;$('dirty').textContent='未保存の変更：'+dirtyCount()+'件';$('save').disabled=dirtyCount()===0}
$('rows').addEventListener('input',e=>{const row=e.target.closest('.video');if(!row)return;const v=videos.find(x=>x.id===row.dataset.id);if(!v)return;if(e.target.dataset.field==='date')v.publishedAt=e.target.value;else if(e.target.dataset.field==='performers')v.performers=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);$('dirty').textContent='未保存の変更：'+dirtyCount()+'件';$('save').disabled=dirtyCount()===0});
$('pages').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b||b.disabled)return;page=Number(b.dataset.page);render()});
$('q').addEventListener('input',()=>{page=1;render()});
$('reload').addEventListener('click',()=>{if(dirtyCount()&& !confirm('未保存の変更があります。破棄して再読み込みしますか？'))return;load()});
$('logout').addEventListener('click',async()=>{try{await api('/logout',{method:'POST',body:'{}'})}finally{location.reload()}});
$('save').addEventListener('click',async()=>{const updates=videos.filter(v=>{const o=original.get(v.id);return o&&((v.publishedAt||'')!==o.publishedAt||(v.performers||[]).join(', ')!==o.performers)}).map(v=>({id:v.id,publishedAt:v.publishedAt||'',performers:v.performers||[]}));if(!updates.length)return;if(!confirm(updates.length+'件の変更をGitHubに保存します。続けますか？'))return;$('save').disabled=true;status('GitHubに保存しています...');try{const result=await api('/api/save',{method:'POST',body:JSON.stringify({updates})});await load();status(result.updated+'件を保存しました。GitHub Pagesへの反映には少し時間がかかります。'+(result.commit?'\n変更履歴：'+result.commit:''))}catch(e){status(e.message,true);$('save').disabled=false}});
boot();
</script>
</body>
</html>
