<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="オモコロチャンネルの動画を出演者・主役・ジャンル・エンディングで探す非公式ファンデータベース">
<title>オモコロチャンネル動画データベース</title>
<style>
:root{color-scheme:light;--ink:#222;--muted:#666;--line:#ddd;--paper:#fff;--wash:#f5f4f1;--accent:#b33c27}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6}header{background:#fff;border-bottom:1px solid var(--line);padding:28px 20px}header .inner,main,footer{max-width:1050px;margin:auto}h1{font-size:clamp(1.45rem,4vw,2.2rem);line-height:1.25;margin:0 0 8px}header p{margin:0;color:var(--muted)}main{padding:24px 16px 48px}.notice{font-size:.9rem;background:#fff8e8;border:1px solid #e8d9b5;padding:12px 14px;border-radius:10px;margin-bottom:18px}.data-status{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:-6px 0 18px;font-size:.92rem}.data-status strong{font-size:1.05rem}.data-status .muted{color:var(--muted);font-size:.85rem}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button,.reset{border:1px solid var(--line);border-radius:8px;padding:10px 16px;background:#fff;font:inherit;cursor:pointer}.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}.filters label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:4px}.filters input,.filters select{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font:inherit;background:white}.filter-wide{grid-column:span 2}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0;color:var(--muted);font-size:.9rem}.list{display:grid;gap:12px}.pagination{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:18px}.pagination button{border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:#fff;font:inherit;cursor:pointer}.pagination button[aria-current=page]{background:var(--ink);color:#fff;border-color:var(--ink)}.pagination button:disabled{opacity:.4;cursor:not-allowed}.page-info{width:100%;text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:4px}.video{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px}.thumb{width:100%;aspect-ratio:16/9;background:#eee;border-radius:7px;display:grid;place-items:center;color:#777;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.video h2,.ending h2{font-size:1.08rem;margin:0 0 6px}.video p{margin:5px 0;color:var(--muted);font-size:.9rem}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:.78rem;padding:3px 8px;background:#f1f0ed;border-radius:999px}.chip.performer{border:1px solid #d7d3cc;background:#fff}.performer-label{font-size:.78rem;color:var(--muted);align-self:center}.chip.main{background:#fbe7e2;color:#8e2d1e;font-weight:650}.video a{color:inherit;text-decoration:none}.video a:hover{text-decoration:underline}.ending-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ending{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.ending .count{font-size:.85rem;color:var(--muted)}.empty{padding:32px 16px;text-align:center;background:#fff;border:1px dashed #ccc;border-radius:12px;color:var(--muted)}footer{padding:20px 16px 35px;font-size:.82rem;color:var(--muted)}.hidden{display:none!important}@media(max-width:700px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.video{grid-template-columns:1fr}.thumb{max-width:420px}.ending-grid{grid-template-columns:1fr}.filter-wide{grid-column:span 2}}
</style>
<!-- Publication date filters and refreshed archive data deployment: 2026-10-30 -->
</head>
<body>
<header><div class="inner"><h1>オモコロチャンネル<br>動画データベース</h1><p>出演者・主役・ジャンル・エンディングから動画を探す非公式ファンサイト</p></div></header>
<main>
<div class="notice">非公式のファン制作データベースです。オモコロおよび関係者の公式サイトではありません。動画本編はYouTubeでご覧ください。</div>
<div class="data-status" id="databaseStatus" aria-live="polite">登録データを読み込んでいます...</div>
<nav class="tabs" aria-label="表示切り替え"><button id="videosTab" aria-selected="true">動画一覧</button><button id="endingsTab" aria-selected="false">エンディング一覧</button></nav>
<section id="videoSection">
<div class="filters">
<div class="filter-wide"><label for="q">キーワード（タイトル・説明）</label><input id="q" type="search" placeholder="動画タイトルやキーワード"></div>
<div><label for="person">出演者</label><select id="person"><option value="">すべて</option></select></div>
<div><label for="protagonist">主役</label><select id="protagonist"><option value="">すべて</option></select></div>
<div><label for="genre">ジャンル</label><select id="genre"><option value="">すべて</option></select></div>
<div><label for="ending">エンディング</label><select id="ending"><option value="">すべて</option></select></div>
<div><label for="year">公開年</label><select id="year"><option value="">すべて</option></select></div>
<div><label for="month">公開月</label><select id="month"><option value="">すべて</option></select></div>
<div><label for="sort">並び順</label><select id="sort"><option value="new">公開日が新しい順</option><option value="old">公開日が古い順</option><option value="title">タイトル順</option></select></div>
</div>
<div class="toolbar"><span id="resultCount">読み込み中…</span><button class="reset" id="reset">条件をリセット</button></div>
<div id="videoList" class="list"></div><nav id="pagination" class="pagination" aria-label="動画一覧のページ切り替え"></nav>
</section>
<section id="endingSection" class="hidden"><p id="endingIntro">登録されているエンディングの一覧です。</p><div id="endingList" class="ending-grid"></div></section>
</main>
<footer>掲載データはファンによる整理を目的としています。動画の権利は各権利者に帰属します。<br>データは確認できた範囲で登録し、誤りがあれば修正します。</footer>
<script>
const $=id=>document.getElementById(id);let videos=[],endings=[],currentPage=1;const PAGE_SIZE=30;
const arr=v=>Array.isArray(v)?v:[];const unique=xs=>[...new Set(xs.flatMap(x=>arr(x)))].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),"ja"));
function fillSelect(id,values,label){const el=$(id),old=el.value;el.innerHTML='<option value="">すべて</option>'+values.map(v=>'<option>'+esc(v)+'</option>').join("");if(values.includes(old))el.value=old}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function linkFor(v){return v.youtubeUrl||v.url|| (v.videoId?'https://www.youtube.com/watch?v='+encodeURIComponent(v.videoId):'')}
function refreshFilters(){fillSelect("person",unique(videos.map(v=>v.performers||v.people||v.cast)));fillSelect("protagonist",unique(videos.map(v=>v.protagonists||v.mainCharacters||v.protagonist)));fillSelect("genre",unique(videos.map(v=>v.genres||v.genre)));fillSelect("ending",unique(videos.map(v=>v.endingScreen||v.endingScreenId||v.ending)));fillSelect("year",[...new Set(videos.map(v=>(v.publishedAt||"").slice(0,4)).filter(x=>/^\d{4}$/.test(x)))].sort((a,b)=>b.localeCompare(a)));fillSelect("month",Array.from({length:12},(_,i)=>String(i+1).padStart(2,"0")))}
function matches(v){const q=$("q").value.trim().toLowerCase(),people=arr(v.performers||v.people||v.cast),mains=arr(v.protagonists||v.mainCharacters||(v.protagonist?[v.protagonist]:[])),genres=arr(v.genres||(v.genre?[v.genre]:[])),end=v.endingScreen||v.endingScreenId||v.ending||"",date=String(v.publishedAt||"");return (!q||[v.title,v.description].join(" ").toLowerCase().includes(q))&&(!$("person").value||people.includes($("person").value))&&(!$("protagonist").value||mains.includes($("protagonist").value))&&(!$("genre").value||genres.includes($("genre").value))&&(!$("ending").value||end===$("ending").value||endings.find(e=>e.id===end)?.name===$("ending").value)&&(!$("year").value||date.startsWith($("year").value))&&(!$("month").value||date.slice(5,7)===$("month").value)}
function renderVideos(){let list=videos.filter(matches);list.sort((a,b)=>$("sort").value==="title"?String(a.title).localeCompare(String(b.title),"ja"):$("sort").value==="old"?String(a.publishedAt||"").localeCompare(String(b.publishedAt||"")):String(b.publishedAt||"").localeCompare(String(a.publishedAt||"")));const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));currentPage=Math.min(currentPage,totalPages);const start=(currentPage-1)*PAGE_SIZE;const pageItems=list.slice(start,start+PAGE_SIZE);$("resultCount").textContent=list.length+" 件中 "+(list.length?start+1:0)+"–"+Math.min(start+PAGE_SIZE,list.length)+" 件を表示（全 "+videos.length+" 件）";$("videoList").innerHTML=list.length?pageItems.map(v=>{const people=arr(v.performers||v.people||v.cast),mains=arr(v.protagonists||v.mainCharacters||(v.protagonist?[v.protagonist]:[])),genres=arr(v.genres||(v.genre?[v.genre]:[])),end=v.endingScreen||v.endingScreenId||v.ending||"",href=linkFor(v),thumb=v.thumbnailUrl||v.thumbnail||"";return '<article class="video"><div class="thumb">'+(thumb?'<img loading="lazy" src="'+esc(thumb)+'" alt="">':'サムネイル未登録')+'</div><div><h2>'+(href?'<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(v.title||"タイトル未登録")+'</a>':esc(v.title||"タイトル未登録"))+'</h2>'+(v.publishedAt?'<p>公開日：'+esc(v.publishedAt)+'</p>':'')+(v.description?'<p>'+esc(v.description)+'</p>':'')+'<div class="chips">'+mains.map(x=>'<span class="chip main">主役：'+esc(x)+'</span>').join("")+(people.filter(x=>!mains.includes(x)).length?'<span class="performer-label">出演</span>'+people.filter(x=>!mains.includes(x)).map(x=>'<span class="chip performer">'+esc(x)+'</span>').join(""):'')+genres.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+(end?'<span class="chip">エンディング：'+esc(endings.find(e=>e.id===end)?.name||end)+'</span>':'')+'</div></div></article>'}).join(""):'<div class="empty">該当する動画はありません。データがまだ登録されていない場合もあります。</div>';renderPagination(totalPages,list.length)}
function renderPagination(totalPages,totalItems){const nav=$("pagination");if(!totalItems){nav.innerHTML="";return}let html='<div class="page-info">ページ '+currentPage+' / '+totalPages+'</div><button type="button" data-page="'+(currentPage-1)+'" '+(currentPage===1?"disabled":"")+' aria-label="前のページ">前へ</button>';const pages=[...new Set([1,totalPages,currentPage-2,currentPage-1,currentPage,currentPage+1,currentPage+2].filter(p=>p>=1&&p<=totalPages))].sort((a,b)=>a-b);let last=0;for(const p of pages){if(last&&p>last+1)html+='<span aria-hidden="true">…</span>';html+='<button type="button" data-page="'+p+'" '+(p===currentPage?'aria-current="page"':'')+' aria-label="ページ '+p+'">'+p+'</button>';last=p}html+='<button type="button" data-page="'+(currentPage+1)+'" '+(currentPage===totalPages?"disabled":"")+' aria-label="次のページ">次へ</button>';nav.innerHTML=html}
function renderEndings(){const list=endings.map(e=>({...e,used:videos.filter(v=>(v.endingScreen||v.endingScreenId||v.ending)===e.id||(v.endingScreen||v.ending)===e.name)}));$("endingIntro").textContent=endings.length+" 種類のエンディングが登録されています。";$("endingList").innerHTML=list.length?list.map(e=>'<article class="ending"><h2>'+esc(e.name||e.id)+'</h2><p>'+esc(e.description||"説明未登録")+'</p><p class="count">使用動画：'+e.used.length+' 件</p>'+(e.used.length?'<ul>'+e.used.map(v=>'<li>'+(linkFor(v)?'<a href="'+esc(linkFor(v))+'" target="_blank" rel="noopener noreferrer">'+esc(v.title)+'</a>':esc(v.title))+'</li>').join("")+'</ul>':'')+'</article>').join(""):'<div class="empty">エンディング情報はまだ登録されていません。</div>'}
function updateDataStatus(){const dated=videos.filter(v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v.publishedAt||""))).length;const tagged=videos.filter(v=>arr(v.performers||v.people||v.cast).length>0).length;const mains=videos.filter(v=>arr(v.protagonists||v.mainCharacters||(v.protagonist?[v.protagonist]:[])).length>0).length;const genreCount=videos.filter(v=>arr(v.genres||(v.genre?[v.genre]:[])).length>0).length;const endingCount=videos.filter(v=>Boolean(v.endingScreen||v.endingScreenId||v.ending)).length;$("databaseStatus").innerHTML="<strong>登録動画："+videos.length.toLocaleString("ja-JP")+"件</strong><br>出演者候補："+tagged.toLocaleString("ja-JP")+"件 / 主役："+mains.toLocaleString("ja-JP")+"件 / ジャンル："+genreCount.toLocaleString("ja-JP")+"件 / エンディング："+endingCount.toLocaleString("ja-JP")+"件<br><span class=\"muted\">出演者は公式アーカイブとの照合候補です。主役・ジャンル・エンディングは今後追加します。</span>"}
function refresh(){refreshFilters();renderVideos();renderEndings();updateDataStatus()}
["q","person","protagonist","genre","ending","year","month","sort"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",()=>{currentPage=1;renderVideos()}));$("pagination").addEventListener("click",event=>{const button=event.target.closest("button[data-page]");if(!button||button.disabled)return;currentPage=Number(button.dataset.page);renderVideos();$("videoList").scrollIntoView({behavior:"smooth",block:"start"})});$("reset").addEventListener("click",()=>{["q","person","protagonist","genre","ending","year","month"].forEach(id=>$(id).value="");$("sort").value="new";currentPage=1;renderVideos()});
$("videosTab").addEventListener("click",()=>{ $("videosTab").setAttribute("aria-selected","true");$("endingsTab").setAttribute("aria-selected","false");$("videoSection").classList.remove("hidden");$("endingSection").classList.add("hidden")});$("endingsTab").addEventListener("click",()=>{$("videosTab").setAttribute("aria-selected","false");$("endingsTab").setAttribute("aria-selected","true");$("videoSection").classList.add("hidden");$("endingSection").classList.remove("hidden")});
async function init(){const status=$("databaseStatus");if(status)status.textContent="動画データを取得しています...";try{const timeout=(url)=>Promise.race([fetch(url+"?v=20261030",{cache:"no-store"}),new Promise((_,reject)=>setTimeout(()=>reject(new Error("読み込みがタイムアウトしました")),20000))]);const [v,e]=await Promise.all([timeout("./data/videos.json"),timeout("./data/ending-screens.json")]);if(!v.ok)throw Error("videos.json: HTTP "+v.status);if(!e.ok)throw Error("ending-screens.json: HTTP "+e.status);videos=arr(await v.json());endings=arr(await e.json());refresh()}catch(err){$("resultCount").textContent="データの読み込みに失敗しました";$("videoList").innerHTML='<div class="empty">データの読み込みに失敗しました。20秒ほど待っても改善しない場合は、再読み込みしてください。</div>';if($("databaseStatus"))$("databaseStatus").innerHTML="<strong>データを読み込めませんでした</strong><br>"+esc(err&&err.message?err.message:"原因不明のエラー");console.error("Database loading error:",err)}}
init();
</script>
</body></html>
