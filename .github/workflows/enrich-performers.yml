name: Enrich performers from Omocoro official archive
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/enrich_performers_from_official_archive.py"
      - ".github/workflows/enrich-performers.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Match performer names from official video archive
        run: python scripts/enrich_performers_from_official_archive.py
      - name: Commit enriched data
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "No performer data could be safely matched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "Enrich performers from official archive"
          git pull --rebase origin main
          git push
