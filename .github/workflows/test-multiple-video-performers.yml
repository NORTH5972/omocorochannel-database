name: Test performer extraction on multiple videos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-multiple-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch descriptions and report performer extraction
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/test_multiple_video_performers.py
