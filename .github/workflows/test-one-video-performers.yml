name: Test one video performer extraction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-one-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch one description and verify performer extraction
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/test_one_video_performers.py
