name: Debug official archive performer extraction
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/debug_official_performers.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect target archive HTML
        run: python scripts/debug_official_performers.py
