name: Collect YouTube video metadata
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Collect recent public metadata from official channel RSS
        run: python scripts/collect_youtube_videos.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "No new video metadata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "Collect recent YouTube video metadata"
          git pull --rebase origin main
          git push
