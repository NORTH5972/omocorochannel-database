name: Collect YouTube video metadata
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/collect-videos.yml"
      - "scripts/collect_youtube_videos.py"
      - "scripts/collect_youtube_performers.py"
      - "scripts/test_youtube_performer_parser.py"
      - "scripts/test_multiple_video_performers.py"
      - "scripts/collect_youtube_playlists.py"
      - "index.html"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
permissions:
  contents: write

# Prevent scheduled/manual/push collection runs from writing the same JSON files concurrently.
concurrency:
  group: omocoro-video-metadata-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Test YouTube description performer parser
        run: python scripts/test_youtube_performer_parser.py
      - name: Verify known videos against YouTube descriptions
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/test_multiple_video_performers.py
      - name: Collect full channel archive and latest RSS entries
        run: python scripts/collect_youtube_videos.py
      - name: Collect performers from YouTube descriptions
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_youtube_performers.py
      - name: Collect official channel playlists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_youtube_playlists.py
      - name: Commit updated index
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if git diff --quiet -- data/videos.json data/playlists.json; then
            echo "No new video or playlist metadata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/playlists.json
          git commit -m "Collect YouTube archive and playlist metadata"
          # Rebase against any changes made while collection was running. If the
          # generated JSON conflicts, rerun collection on the newest main instead
          # of attempting to merge two independently generated snapshots.
          if ! git pull --rebase origin main; then
            git rebase --abort
            git fetch origin main
            git reset --hard origin/main
            python scripts/collect_youtube_videos.py
            python scripts/collect_youtube_performers.py
            python scripts/collect_youtube_playlists.py
            if git diff --quiet -- data/videos.json data/playlists.json; then
              echo "No metadata changes after refreshing from latest main."
              exit 0
            fi
            git add data/videos.json data/playlists.json
            git commit -m "Collect YouTube archive and playlist metadata (refreshed)"
          fi
          git push
